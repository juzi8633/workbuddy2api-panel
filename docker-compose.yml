services:
  wb2api:
    build: .
    container_name: workbuddy2api
    restart: unless-stopped
    # 挂载目录及配置文件归属必须匹配运行 UID/GID，目录需可写及可遍历。
    # 自己创建目录时：PUID=$(id -u) PGID=$(id -g) docker compose up -d
    # 或保持默认用户：sudo chown -R 10001:10001 ./auths ./data ./config
    # 首次启动/从单文件挂载迁移：见 README，保留原配置且不要覆盖已有配置。
    user: "${PUID:-10001}:${PGID:-10001}"
    # ENTRYPOINT 已含 -config /app/config.json；追加同名参数，后者生效。
    command: ["-config", "/app/config/config.json"]
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      # 必须挂载可写目录：保存需在配置旁创建临时文件并原子替换。
      # 启动前 mkdir -p config 并按 README 初始化/迁移；不要挂 :ro。
      - ./config:/app/config
