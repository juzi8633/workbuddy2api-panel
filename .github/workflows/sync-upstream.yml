name: Sync upstream into our fork

on:
  schedule:
    # Daily at 03:23 China Standard Time (19:23 UTC).
    - cron: '23 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'juzi8633/workbuddy2api-panel'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Merge, verify and push only to our fork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash scripts/sync-upstream.sh
